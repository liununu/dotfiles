bind r source-file ~/.tmux.conf \; display "Yep!"

bind e new-window "vim ~/.tmux.conf"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind b set-option status

bind c new-window      -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

setw -g mode-keys vi

set -g default-terminal "screen-256color"

set -g mouse             on

set -g set-titles        on
set -g set-titles-string "[#{session_name}] #{window_name}"

set -g base-index      1
set -g pane-base-index 1

set -g status-interval 2

set -g window-status-format         "#[fg=white] #W "
set -g window-status-style          dim
set -g window-status-current-format "#[fg=green]• #W "
set -g window-status-current-style  bold
set -g status-position              bottom
set -g status-justify               centre
set -g status-left                  "  #[fg=green]• #[fg=white]• #[fg=magenta]•"
set -g status-right                 " #[fg=magenta]• #S  "
set -g status-bg                    black

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'timvw/tmux-assistant-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'

set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
